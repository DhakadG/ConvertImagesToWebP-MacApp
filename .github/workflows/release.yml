name: Release

on:
  push:
    tags: ["v*.*.*"]

# Only the publish job needs to write, to create the release and attach assets.
permissions:
  contents: read

jobs:
  macos-app:
    strategy:
      fail-fast: false
      matrix:
        include:
          # py2app bundles the running interpreter, so a single runner produces
          # a single-arch app that will not launch on the other kind of Mac.
          - runner: macos-15-intel
            arch: intel
            expect_arch: x86_64
          - runner: macos-14
            arch: apple-silicon
            expect_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -r requirements.txt
          pip install py2app
      - run: python setup.py py2app
      - name: Verify the bundle opens before publishing it
        run: |
          set -euo pipefail
          APP="dist/WebP Studio.app"
          BIN="$APP/Contents/MacOS/WebP Studio"
          test -d "$APP" || { echo "::error::py2app produced no bundle"; exit 1; }

          archs=$(lipo -archs "$BIN")
          echo "architectures: $archs"
          case "$archs" in
            *${{ matrix.expect_arch }}*) ;;
            *) echo "::error::expected ${{ matrix.expect_arch }}, got $archs"; exit 1 ;;
          esac

          if [ -z "$(find "$APP/Contents/Resources" -path '*customtkinter*' -name '*.json' -print -quit)" ]; then
            echo "::error::CustomTkinter theme assets missing from the bundle"
            exit 1
          fi

          "$BIN" --check

          # Publishing a build nobody has opened is how a broken app reaches
          # people with a version number on it.
          "$BIN" > launch.log 2>&1 &
          PID=$!
          sleep 25
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "::error::the app crashed at startup — refusing to publish"
            cat launch.log
            exit 1
          fi
          kill "$PID" 2>/dev/null || true
          echo "launched and stayed up"
          cat launch.log
      - run: ditto -c -k --keepParent "dist/WebP Studio.app" "WebP-Studio-macOS-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WebP-Studio-macOS-${{ matrix.arch }}
          path: WebP-Studio-macOS-${{ matrix.arch }}.zip
          retention-days: 5

  publish:
    needs: macos-app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: WebP-Studio-macOS-*
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # Templated into the run script as literal text, so a tag crafted
          # with shell metacharacters would be interpreted by bash. Passing
          # it through env and referencing $TAG_NAME instead means the shell
          # only ever sees it as a variable's value, never as script text.
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" dist/*.zip \
            --title "$TAG_NAME" \
            --generate-notes
